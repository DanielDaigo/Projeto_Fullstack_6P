{% extends 'acervo/base.html' %} {% block conteudo %}
<div class="card">
  <div class="card-header">
    <h1>Cadastrar Novo Livro</h1>
  </div>

  <form method="post">
    {% csrf_token %}
    <div
      style="
        display: flex;
        flex-direction: column;
        gap: 1rem;
        margin-bottom: 1.5rem;
      "
    >
      {{ form.as_p }}
    </div>
    <button type="submit" class="btn">Salvar Livro</button>
    <a
      href="{% url 'lista' %}"
      style="
        margin-left: 1rem;
        color: var(--text-muted);
        text-decoration: none;
        font-size: 0.9rem;
      "
      >Cancelar</a
    >
  </form>
</div>
{% endblock %}
